---
- name: Demo Playbook to Export PowerMax Performance Thresholds and Alerting Settings from Unisphere for PowerMax
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:
    - name: Get PowerMax Performance Threshold and Alert Settings
      uri:
        url: "https://Unisphere:8443/univmax/restapi/103/settings/alert/performance_threshold"
        validate_certs: false
        user: "ansible_user"
        password: "secret"
        timeout: 200
        headers:
          Content-Type: "application/json"
        method: GET
        status_code:
          - 200
          - 201
